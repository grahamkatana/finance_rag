server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Answers are rendered as markdown (no raw HTML), and this policy is the
    # backstop: no inline or third-party script, nothing can frame the app.
    # 'unsafe-inline' for styles only -- Radix sets inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "finance-rag" is the backend Service name in k8s (finance-rag-k8s/05-app.yaml).
    location /api/ {
        proxy_pass http://finance-rag:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers stream token by token and uploads stream progress events;
        # buffering would hold both back until the response is complete.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # PDF uploads (10-K filings run to several MB).
        client_max_body_size 50m;
    }
}
